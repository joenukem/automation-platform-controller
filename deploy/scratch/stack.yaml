        - name: awx-projects
          mountPath: /var/lib/awx/projects
        - name: awx-job-status
          mountPath: /var/lib/awx/job_status
        readinessProbe:
          exec:
            command:
            - python3
            - -c
            - "import os, sys\nwanted = {\n    \"awx-manage run_dispatcher\": False,\n\
              \    \"awx-manage run_callback_receiver\": False,\n    \"awx-manage\
              \ run_wsrelay\": False,\n}\nfor pid in os.listdir(\"/proc\"):\n    if\
              \ not pid.isdigit():\n        continue\n    try:\n        raw = open(f\"\
              /proc/{pid}/cmdline\", \"rb\").read()\n    except OSError:\n       \
              \ continue\n    cmd = raw.replace(b\"\\0\", b\" \").decode(\"utf-8\"\
              , \"ignore\")\n    for needle in wanted:\n        if needle in cmd:\n\
              \            wanted[needle] = True\nsys.exit(0 if all(wanted.values())\
              \ else 1)\n"
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 45
